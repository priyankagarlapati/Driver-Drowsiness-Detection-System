<!DOCTYPE html>
<html>
    <head>
		<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">
        <style>
  
  img{
  width: 100%;
  }
  .login {
    height: 100vh;
    width: 100%;
    position: relative;
  }
  .login_box {
    width: 1050px;
    height: 600px;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    background: #fff;
    border-radius: 10px;
    box-shadow: 1px 4px 22px -8px #0004;
    display: flex;
    overflow: hidden;
  }
  .login_box .left{
  width: 41%;
  height: 100%;
  padding: 25px 25px;
  
  }
  .login_box .right{
  width: 59%;
  height: 100%  
  }
  .left .top_link a {
    color: #452A5A;
    font-weight: 400;
  }
  .left .top_link{
  height: 20px
  }
  .left .contact{
  display: flex;
    align-items: center;
    justify-content: center;
    align-self: center;
    height: 100%;
    width: 73%;
    margin: auto;
  }
  .left h3{
  text-align: center;
  margin-bottom: 40px;
  }
  .left input {
    border: none;
    width: 80%;
    margin: 15px 0px;
    border-bottom: 1px solid #4f30677d;
    padding: 7px 9px;
    width: 100%;
    overflow: hidden;
    background: transparent;
    font-weight: 600;
    font-size: 14px;
  }
  .left{
  background: linear-gradient(-45deg, #dcd7e0, #fff);
  }
  .submit {
    border: none;
    padding: 15px 70px;
    border-radius: 8px;
    display: block;
    margin: auto;
    margin-top: 120px;
    background: #583672;
    color: #fff;
    font-weight: bold;
    -webkit-box-shadow: 0px 9px 15px -11px rgba(88,54,114,1);
    -moz-box-shadow: 0px 9px 15px -11px rgba(88,54,114,1);
    box-shadow: 0px 9px 15px -11px rgba(88,54,114,1);
  }
  
  
  
    .right {
    background-image: url("{{ url_for('static', filename='bgbg.jpg') }}");
    background-repeat: no-repeat;
    background-size: cover;
    backface-visibility: visible;
    position: relative;
  }
  
  .right .right-text{
  height: 100%;
  position: relative;
  transform: translate(0%, 15%);
  }
  .right-text h2{
  display: block;
  width: 100%;
  text-align: center;
  font-size: 50px;
  font-weight: 500;
  }
  .right-text h5{
  display: block;
  width: 100%;
  text-align: center;
  font-size: 19px;
  font-weight: 400;
  }
  
  .right .right-inductor{
  position: absolute;
  width: 70px;
  height: 7px;
  background: #fff0;
  left: 50%;
  bottom: 70px;
  transform: translate(-50%, 0%);
  }
  .top_link img {
    width: 28px;
    padding-right: 7px;
    margin-top: -3px;
  }
  
  .overlap-text {
    position: relative;
  }
  
  
  .overlap-text a {
    position: absolute;
    top: 22px;
    right: 10px;
    color: gray;
    font-size: 14px;
    text-decoration: none;
    font-family: 'Overpass Mono', monospace;
    letter-spacing: -1px;
  }
  
            .input-1,
            .input-2 {
                width: 100%;
                margin-bottom: 5px;
                padding: 8px 12px;
                border: 1px solid #dbdbdb;
                box-sizing: border-box;
                border-radius: 3px;
            }   
  
            .l-part{
                margin-top: 10px;
            }
            #video_feed {
            display: none;
            }
            * {
                margin: 0px;
                padding: 0px;
            }
            #signup{
                    background-color: #583672;
                    margin-left: 100px;
                    margin-top: 30px;
                    color: white;
                    border-radius: 8px;
                    font-weight: bold;
                    -webkit-box-shadow: 0px 9px 15px -11px rgba(88,54,114,1);
                    -moz-box-shadow: 0px 9px 15px -11px rgba(88,54,114,1);
                    box-shadow: 0px 9px 15px -11px rgba(88,54,114,1);
                    border: none;
                    padding: 15px 50px;
                    border-radius: 8px;
                    display: block;
                    margin: auto;
                    margin-top: 30px;
                    }
            body {
                background-image: url("{{ url_for('static', filename='image.webp') }}");
                background-repeat: no-repeat;
                background-size: cover;
                backface-visibility: visible;
            }
            #wrapper {
                width: 500px;
                height: 50%;
                overflow: hidden;
                border: 0px solid #000;
                margin: 50px auto;
                padding: 10px;
            }
            .main-content {
                width: 250px;
                height: 40%;
                margin: 10px auto;
                background-color: #fff;
                border: 2px solid #e6e6e6;
                padding: 40px 50px;
            }
            .btn {
                width: 50%;
                background-color: #3897f0;
                border: 1px solid #3897f0;
                padding: 5px 12px;
                margin-bottom: 10px;
                color: #fff;
                font-weight: bold;
                font-size: large;
                cursor: pointer;
                border-radius: 3px;
            }
            .header {
                border: 0px solid #000;
                margin-bottom: 10px;
            }
            .l-part{
                text-align: center;
            }
            input:focus {
                background-color: yellow;
            }
        </style>
    </head>
    <body>
        <script>
            function startCamera() {
            fetch("{{ url_for('start_camera_route') }}")
                .then(response => {
                    if (response.ok) {
                        document.getElementById("video_feed").style.display = "block";
                    }
                });
        }
        </script>
        <section class="login">
			<div class="login_box">
				<div class="left">
					<div class="contact">
						<form action=" ">
							<h3 style="color:#911f86;text-align: center;font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;">An Enhanced Road Safety Technology</h4><br>
                            <h4 style="text-align: center; color: #8b3996;font-family: 'Times New Roman', Times, serif;"><b>Detecting Drowsiness...!!!</b></h5>
                            <img src="{{ url_for('static', filename='cam.jpeg') }}" alt="Camera Image" width="30" height="200">
                            <input type="button" onclick="startCamera()" value="Start Camera" id="signup">
                            <img id="video_feed" src="{{ url_for('video_feed') }}">
						</form>
					</div>
				</div>
				<div class="right">
					<div class="right-text">
						<h2 style="color:#533471;font-family: constantia;"><b>Driver Drowsiness <br>Alert System</b></h2>
					</div>
				</div>
			</div>
		</section>
    </body>
</html>
